services:
  - type: web
    name: iot-temperature-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn presentation.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false # Definir secretamente no dashboard do Render
      - key: UPSTASH_REDIS_REST_URL
        value: https://nearby-liger-154294.upstash.io
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false # Definir secretamente no dashboard do Render
      - key: ALLOWED_ORIGINS
        value: "*"
